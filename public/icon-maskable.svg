<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background extending completely to 512x512 borders -->
  <rect width="512" height="512" fill="url(#bgMask)" />

  <!-- Inner 80% Safe Zone contains all graphics (Center: 256, 256, Radius: 204px) -->
  <g transform="translate(136, 146)">
    <!-- Scaled Ticket Body inside 240x220 safe zone -->
    <path d="M 26,0
             L 214,0
             A 26,26 0 0,1 240,26
             L 240,90
             A 22,22 0 0,0 240,134
             L 240,194
             A 26,26 0 0,1 214,220
             L 26,220
             A 26,26 0 0,1 0,194
             L 0,134
             A 22,22 0 0,0 0,90
             L 0,26
             A 26,26 0 0,1 26,0 Z"
          fill="url(#goldMask)" />

    <line x1="72" y1="16" x2="72" y2="204" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="6 6" />

    <!-- Crown Icon -->
    <g transform="translate(24, 90)">
      <path d="M 3,30 L 3,10 L 12,20 L 20,3 L 28,20 L 37,10 L 37,30 Z" fill="#ffffff" fill-opacity="0.95" />
      <circle cx="3" cy="8" r="2.5" fill="#ffffff" />
      <circle cx="20" cy="2" r="3" fill="#ffffff" />
      <circle cx="37" cy="8" r="2.5" fill="#ffffff" />
      <rect x="3" y="32" width="34" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.95" />
    </g>

    <!-- Wordmark & Stage Arcs -->
    <g transform="translate(94, 52)">
      <path d="M 16,32 Q 62,0 108,32" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.9" />
      <path d="M 28,47 Q 62,20 96,47" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.7" />

      <!-- Center Star -->
      <path d="M 62,70 L 64,80 L 74,82 L 64,84 L 62,94 L 60,84 L 50,82 L 60,80 Z" fill="#ffffff" />

      <!-- Wordmark -->
      <text x="62" y="124" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="3">LINDU</text>
      <text x="62" y="142" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#ffffff" fill-opacity="0.8" text-anchor="middle" letter-spacing="4">TICKET</text>
    </g>
  </g>
</svg>
